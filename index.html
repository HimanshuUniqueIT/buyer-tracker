<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Buyer Tracker Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Light theme only, by request. Layout: one app shell with two views — bot demo (scenarios + phone) and team dashboard (sidebar + workspace). */
:root{
  --bg:#edf0ec; --panel:#fbfcfa; --ink:#17201d; --muted:#5d6b66; --line:#d5dcd7; --soft:#f3f5f2;
  --accent:#0d6b57; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --chat:#e9e4da; --chat-dot:#ddd6c9; --in:#ffffff; --out:#d4efd9; --out-ink:#17201d;
  --warn:#8a5300; --warn-bg:#fdf0d6; --bad:#a8261d; --bad-bg:#fbe3e0; --good:#1c7443; --good-bg:#dff1e5;
  --c1:#0d6b57; --c2:#c27a12; --c3:#5b54b8; --c4:#7c8a85;
  --shadow:0 1px 2px rgba(23,32,29,.08); color-scheme:light;
  --f-display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.mainnav{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.mainnav button,.subtabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.mainnav button[aria-selected="true"],.subtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:12.5px}
.ghost:hover{border-color:var(--accent)}
.ghost.danger{color:var(--bad)}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:8px 14px}
.primary:disabled{opacity:.5;cursor:not-allowed}

.views{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:none;padding-block:0 16px}
.view.active{display:flex}

/* ---- Bot demo ---- */
#v-bot{gap:16px}
.bot-grid{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(340px,480px);gap:20px;width:100%;justify-content:center}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column}
.subtabs{display:none;gap:3px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.scen{overflow-y:auto;padding-right:4px}
.scen-group{margin-top:14px}
.scen-group h3{margin-bottom:6px}
.scen-list{display:flex;flex-direction:column;gap:4px}
.scen-btn{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scen-btn:hover{border-color:var(--accent)}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);flex:none}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.controls label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.controls select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 6px;font-size:13px;color:var(--ink);max-width:210px}
.phone{flex:1;min-height:420px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--chat);position:relative;box-shadow:var(--shadow)}
.phone-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--accent);color:var(--accent-ink)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.phone-head b{display:block;font-size:14.5px}
.phone-head span{font-size:12px;opacity:.85}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:5px;background-image:radial-gradient(var(--chat-dot) 1px,transparent 1px);background-size:14px 14px}
.row{display:flex;flex-direction:column;max-width:86%}
.row.in{align-self:flex-start}
.row.out{align-self:flex-end;align-items:flex-end}
.bub{padding:7px 10px 5px;border-radius:10px;font-size:14px;line-height:1.42;box-shadow:var(--shadow);overflow-wrap:anywhere}
.in .bub{background:var(--in);border-top-left-radius:3px}
.out .bub{background:var(--out);color:var(--out-ink);border-top-right-radius:3px}
.meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--f-mono)}
.out .meta::after{content:" ✓✓";color:var(--accent)}
.warnline{display:block;margin-top:6px;padding:5px 7px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.btns{display:grid;gap:3px;margin-top:3px;width:100%}
.btns.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
.rbtn{border:0;background:var(--in);color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 6px;border-radius:8px;box-shadow:var(--shadow)}
.used .rbtn{opacity:.55}
.rbtn.picked{opacity:1;outline:2px solid var(--accent);outline-offset:-2px}
.sys{align-self:center;background:var(--panel);color:var(--muted);font-size:11.5px;padding:3px 10px;border-radius:7px;margin:6px 0;box-shadow:var(--shadow);text-align:center}
.typing{align-self:flex-start;background:var(--in);border-radius:10px;padding:9px 12px;display:flex;gap:4px;box-shadow:var(--shadow)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.voice{display:flex;align-items:center;gap:8px;min-width:180px}
.voice .play{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.wave{display:flex;align-items:center;gap:2px;height:22px;flex:1}
.wave b{display:block;width:3px;border-radius:2px;background:var(--muted);opacity:.6}
.card-photo{width:200px;aspect-ratio:1.7;max-width:100%;border-radius:6px;background:linear-gradient(135deg,var(--panel),var(--line));display:flex;flex-direction:column;justify-content:center;padding:12px;gap:3px;font-size:11px;color:var(--muted);transform:rotate(-2deg)}
.card-photo strong{color:var(--ink);font-size:13px}
.contact{display:flex;gap:9px;align-items:center;min-width:180px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.contact .av{background:var(--accent-soft);color:var(--accent)}
.contact-foot{text-align:center;color:var(--accent);font-weight:600;font-size:13px}
.doc{display:flex;gap:8px;align-items:center}
.doc .ic{width:30px;height:36px;border-radius:4px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;font-size:9px;font-weight:700}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;background:var(--chat);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--in);border-radius:18px;padding:9px 14px;max-height:120px;line-height:1.35;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;background:var(--in);color:var(--muted);box-shadow:var(--shadow)}
.iconbtn.send{background:var(--accent);color:var(--accent-ink)}
.menu{position:absolute;left:8px;right:8px;bottom:58px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;z-index:3}
.menu button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.menu button:hover{background:var(--accent-soft)}
.menu small{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13px;text-align:left}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}

/* ---- Dashboard ---- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;line-height:1.3}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#v-dash{min-height:0}
.dash{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;width:100%}
.dnav{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:0}
.dnav .who{display:flex;gap:9px;align-items:center;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dnav .who b{display:block;font-size:13.5px}
.dnav .who span{font-size:12px;color:var(--muted)}
.uav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.dnav button.nav{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.dnav button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dnav button.nav:hover{background:var(--soft)}
.count{font-size:11px;font-family:var(--f-mono);background:var(--warn-bg);color:var(--warn);padding:1px 6px;border-radius:999px}
.dnav .spacer{flex:1}
.work{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.work-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.work-head h2{font-size:22px}
.work-head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--soft)}
.t .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-active,.p-won,.p-approved{background:var(--good-bg);color:var(--good)}
.p-retail,.p-new{background:var(--accent-soft);color:var(--accent)}
.p-archived,.p-inactive,.p-lost{background:var(--line);color:var(--muted)}
.p-optedout{background:var(--bad-bg);color:var(--bad)}
.p-pending,.p-quoted,.p-negotiation,.p-due{background:var(--warn-bg);color:var(--warn)}
.cat{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--soft);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed-item:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.dot.created{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot.remark{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.dot.deal,.dot.stage{background:var(--good-bg);color:var(--good);border-color:transparent}
.feed-item .when{color:var(--muted);font-size:12px}
.feed-item q{quotes:"“" "”"}
.searchbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchbar input[type=search]{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font-size:14.5px}
.searchbar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px}
.rangectl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rangectl select,.rangectl input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 8px;font-size:13px}
.rangectl .rl{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px}
.bhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.bhead h2{font-size:24px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px;margin-top:12px}
.facts div{font-size:13px;min-width:0;overflow-wrap:anywhere}
.facts span{display:block;font-size:11.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;position:relative}
.tl::before{content:"";position:absolute;left:13.5px;top:38px;bottom:-10px;width:1px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .what{font-size:13.5px}
.tl .by{color:var(--muted);font-size:12px;margin-top:2px}
.tl .txt{margin-top:4px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.empty{padding:22px 8px;color:var(--muted);text-align:center}
.backlink{border:0;background:none;color:var(--accent);font-weight:600;padding:0;align-self:flex-start}
.locked{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}

.login{flex:1;display:grid;place-items:center;overflow-y:auto;padding-block:20px}
.login-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login-card h2{font-size:22px}
.pick{display:flex;flex-direction:column;gap:6px}
.pick label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input{accent-color:var(--accent)}
.pick small{color:var(--muted);display:block}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14px;min-width:0}

.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:flex;justify-content:center;align-items:center;padding:16px}
.sheet{background:var(--panel);border-radius:14px;width:min(520px,100%);max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet .close{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:7px;padding:4px 10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1 / -1}
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.msg{padding:8px 10px;border-radius:8px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:9px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

@media (max-width:1180px){ .bot-grid{grid-template-columns:260px minmax(320px,460px)} .grid2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1000px){
  .bot-grid{grid-template-columns:minmax(0,1fr)}
  .subtabs{display:flex}
  .bot-grid .pane{display:none}
  .bot-grid .pane.on{display:flex}
  .dash{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .dnav{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
  .dnav .who{border:0;padding:0 8px 0 0;margin:0}
  .dnav .spacer{display:none}
}
@media (max-width:520px){ .form{grid-template-columns:1fr} .dnav .who span{display:none} }
@media (prefers-reduced-motion:reduce){ .typing i{animation:none} }
</style>

<div class="app">
  <header class="top gutter">
    <div class="brand">
      <div class="mark">BT</div>
      <div><h1>Buyer Tracker</h1><p>WhatsApp lead bot and team dashboard · demo with example data</p></div>
    </div>
    <nav class="mainnav" aria-label="Views">

const fmtIn = d => `+91 ${d.slice(0,5)} ${d.slice(5)}`;
const fmtIntl = d => d.startsWith('971') && d.length===12 ? `+971 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8)}` : '+'+d;

function classifyPhone(raw){
  let digits = raw.replace(/\D/g,'');
  const t = raw.trim();
  const plus = t.startsWith('+') || t.startsWith('00');
  if(t.startsWith('00')) digits = digits.slice(2);
  if(plus){
    if(digits.startsWith('91')){const d=digits.slice(2); return d.length===10?{kind:'in',digits:d}:{kind:'bad',digits:d,len:d.length};}
    if(digits.length>=8 && digits.length<=15) return {kind:'intl',digits};
    return null;
  }
  if(digits.length===12 && digits.startsWith('91')) return {kind:'in',digits:digits.slice(2)};
  if(digits.length===11 && digits.startsWith('0')) return {kind:'in',digits:digits.slice(1)};
  if(digits.length===10) return {kind:'in',digits};
  if(digits.length===9 || digits.length===11) return {kind:'bad',digits,len:digits.length};
  return null;
}
function findPhones(text){
  const out=[]; const re=/(?:\+|00)?\d[\d \-().]{6,20}\d/g; let m;
  while((m=re.exec(text))){
    let raw=m[0], c=classifyPhone(raw);
    while(!c && /\s/.test(raw.trim())){ raw=raw.trim().replace(/\s+\S+$/,''); if(raw.replace(/\D/g,'').length<9) break; c=classifyPhone(raw); }
    if(c){ out.push({raw, index:m.index, ...c}); re.lastIndex = m.index + raw.length; }
  }
  return out;
}
function phoneInfo(p){
  if(p.kind==='in') return {phone:fmtIn(p.digits), phoneKey:'91'+p.digits, phoneDigits:p.digits, fake:isFake(p.digits,true)};
  return {phone:fmtIntl(p.digits), phoneKey:p.digits, phoneDigits:p.digits, fake:isFake(p.digits,false)};
}
function isFake(d,indian){
  if(/^(\d)\1+$/.test(d)) return true;
  if(['1234567890','0123456789','9876543210','1234512345','1111122222'].includes(d)) return true;
  if(indian && !/^[6-9]/.test(d)) return true;

}
function hasKey(t,key){ return /[^\x00-\x7f]/.test(key) ? t.includes(key) : new RegExp('(^|[^a-z])'+esc(key)+'(?![a-z])').test(t); }
function findLocation(t){
  let best=null;
  const check=(dict,overseas)=>{ for(const k in dict){ let idx;
      if(/[^\x00-\x7f]/.test(k)) idx=t.indexOf(k); else { const m=new RegExp('(^|[^a-z])'+esc(k)+'(?![a-z])').exec(t); idx=m?m.index+m[1].length:-1; }
      if(idx>=0 && (!best || idx<best.idx || (idx===best.idx && k.length>best.key.length))) best={idx,key:k,location:dict[k],overseas}; } };
  check(CITY,false); check(COUNTRY,true);
  if(!best) return null;
  const alias = !best.overseas && /^[a-z ]+$/.test(best.key) && low(best.location)!==best.key ? {from:titleCase(best.key), to:best.location} : null;
  return {location:best.location, overseas:best.overseas, key:best.key, alias};
}
function findModel(t){
  let best=null;
  for(const m of MODELS) for(const k of m.keys){ const re=new RegExp('(^|[^a-z0-9])('+esc(k)+')(?![a-z0-9])'); const r=re.exec(t);
    if(r && (!best || k.length>best.key.length)) best={model:m,key:k,idx:r.index+r[1].length}; }
  if(best) return {exact:true, ...best};
  const words=t.split(/\s+/).filter(Boolean);
  let sug=null;
  for(const m of MODELS) for(const k of m.keys){ const kw=k.split(' '); if(k.length<7) continue;
    for(let i=0;i+kw.length<=words.length;i++){ const win=words.slice(i,i+kw.length);
      if(!kw.every((w,j)=> /^\d+$/.test(w) ? win[j]===w : !/^\d+$/.test(win[j]))) continue;
      const s=win.join(' '); const dist=lev(s,k);
      if(dist>=1 && dist<=2 && (!sug || dist<sug.dist)) sug={model:m,key:k,typed:s,dist}; } }

}
const QTY = '(\\d+(?:\\s*(?:-|to)\\s*\\d+)?)';

  const pats=[ new RegExp('\\b(?:qty|quantity|qnty)\\s*[:,\\-]?\\s*'+QTY),
    new RegExp(QTY+'\\s*(?:pcs|pc|pieces?|units?|nos|nang|pis|qty|sets?|boxes)\\b'),
    new RegExp('\\b(?:wants?|needs?|order|requirement|chahiye|joie|joiye)\\s*(?:of\\s*)?'+QTY+'\\b'),
    new RegExp(QTY+'\\s*(?:ke\\s+)?(?:chahiye|joie|joiye)'),
    /\b(\d{1,4})\s*x\b/ ];
  for(const re of pats){ const m=re.exec(t); if(m) return m[1].replace(/\s*(?:-|to)\s*/,'-'); }
  return null;
}
function matchSource(t){ t=low(t); for(const s of SOURCES) if(t.trim()===low(s)) return s; for(const [re,s] of SOURCE_RX) if(re.test(t)) return s; return null; }
function extractName(w){
  const toks=w.split(/\s+/).filter(Boolean); const name=[];
  for(let i=0;i<toks.length && i<16;i++){ const t=toks[i];
    const bad = !/^[a-z][a-z'.-]*$/.test(t) || t.length<2 || STOP.has(t) || CITY[t] || COUNTRY[t];
    if(!name.length){ if(!bad) name.push(t); } else { if(bad) break; name.push(t); if(name.length===3) break; } }
  return name.length ? titleCase(name.join(' ')) : null;
}
const REMARK_RX = /\b(pay|pays|paid|payment|cash|credit|advance|cod|delivery|deliver|urgent|urgently|jaldi|prefers?|bill|invoice|discount|rate|price|budget|ship|ships|shipping|courier|usd|aed|dollars?|dirhams?|export|sunday|morning|evening|regular|samples?|karega|dega)\b|call (him |her )?(after|before|in|on)/;
const HI_REMARK = [[/cash payment kare(ga|nge|gi)?|cash (dega|denge|degi)/,'Will pay cash'],[/advance (dega|denge|degi)|advance payment kare(ga)?|advance me/,'Will pay in advance'],

function parseLead(text){
  const L={name:null,business:null,phone:null,phoneKey:null,phoneDigits:null,phoneBad:null,alt:null,altKey:null,fake:false,location:null,overseas:false,locAlias:null,
    brand:null,model:null,category:null,modelSuggest:null,qty:null,qtyVague:null,source:null,referrer:null,remark:'',retail:false,contactNote:null,gst:null,mixedLang:false};

  const gstM=/\b\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]\b/i.exec(src);
  if(gstM){ L.gst=gstM[0].toUpperCase(); src=src.replace(gstM[0],' '); }
  const labName=/\b(?:name|naam)\s*(?:is|hai|:|-)\s*([^\n,]+)/i.exec(src);
  const labCity=/\b(?:city|location|place)\s*[:\-]\s*([^\n,]+)/i.exec(src);
  const labSource=/\bsource\s*[:\-]\s*([^\n,]+)/i.exec(src);
  const phones=findPhones(src);
  const good=phones.filter(p=>p.kind!=='bad');
  if(good[0]) Object.assign(L, phoneInfo(good[0]));
  else if(phones[0]) L.phoneBad={raw:phones[0].raw.trim(), len:phones[0].len};
  if(good[1]){ const a=phoneInfo(good[1]); L.alt=a.phone; L.altKey=a.phoneKey; }
  phones.forEach(p=>{ src=src.replace(p.raw,' | '); });
  let w=' '+low(src).replace(/[;\n:.]+/g,' , ').replace(/,/g,' , ').replace(/[^a-z0-9ऀ-ॿ઀-૿,'\-|+ ]+/g,' ').replace(/\s+/g,' ')+' ';
  const bizM=/(?:^|\s)((?:[a-z0-9&]+\s+){1,2}(?:mobiles?|electronics|telecom|traders|trading|enterprises|communications?|stores?|gallery|impex|exports|general trading))(?=\s|$)/.exec(w);
  if(bizM){ const words=bizM[1].trim().split(' ').filter(x=>!STOP.has(x)||/mobiles?|electronics|telecom|traders|trading/.test(x)); if(words.length>1){ L.business=titleCase(words.join(' ')); w=w.replace(bizM[1],' , '); } }
  const loc = findLocation(w) || (labCity ? {location:titleCase(labCity[1]), overseas:false, key:null, alias:null} : null);
  if(loc){ L.location=loc.location; L.overseas=loc.overseas; L.locAlias=loc.alias; }
  const mm=findModel(w);
  if(mm && mm.exact){ L.model=mm.model.name; L.brand=mm.model.brand; L.category=mm.model.cat; w=w.replace(new RegExp('(^|[^a-z0-9])'+esc(mm.key)+'(?![a-z0-9])'),'$1 | '); }
  else if(mm){ L.modelSuggest={name:mm.model.name,brand:mm.model.brand,cat:mm.model.cat,typed:mm.typed}; w=w.replace(mm.typed,' | '); }
  if(!L.brand) for(const [re,b] of BRAND_RX) if(re.test(w)){ L.brand=b; break; }
  if(!L.category){ if(/\b(phones?|mobiles?|smartphones?|iphones?)\b/.test(w)) L.category='Phone'; else if(/\b(watch(es)?|ghadi|smartwatch(es)?)\b/.test(w)) L.category='Watch'; else if(/\b(earbuds|airpods|headphones)\b/.test(w)) L.category='Audio'; }
  L.qty=findQty(w);
  if(!L.qty){ const v=/\b(lots|lot of|many|bulk|bahut|zyada|ghana|plenty|several)\b/.exec(w); if(v) L.qtyVague=v[1]; }
  L.source = (labSource && matchSource(labSource[1])) || matchSource(w);
  const refM=/\b(?:referred by|reference of|reference from|referral from|ref by|ref from)\s+([a-z]+(?:\s+[a-z]+)?)/.exec(w);
  if(refM){ const r=refM[1].split(' ').filter(x=>!STOP.has(x)); if(r.length) L.referrer=titleCase(r.join(' ')); }
  if(/\b(personal use|for himself|for herself|for self|own use|khud ke liye|potana mate|as a gift|for his (son|daughter|wife)|for her (son|daughter|husband))\b/.test(w) || L.qty==='1') L.retail=true;
  const relM=/\b(his|her|their)\s+(partner|brother|son|father|manager|cousin|friend|wife|husband|accountant|staff)(?:'s|s)?\s+(?:number|no|phone|mobile)\b/.exec(w);
  if(relM) L.contactNote=`Number belongs to ${relM[1]} ${relM[2]}`;
  let wn=w; if(refM) wn=wn.replace(refM[0],' , ');
  L.name = (labName && extractName(' '+low(labName[1]).replace(/[^a-z\s'.-]/g,' ')+' ')) || extractName(wn);

    if(/\b(referred|referral|reference)\b/.test(lc)) continue;
    if(!REMARK_RX.test(lc)) continue;
    let out=null; for(const [re,en] of HI_REMARK) if(re.test(lc)){ out=en; break; }
    if(!out){ if(/[ऀ-૿]|\b(hai|dega|karega|che)\b/.test(lc)) continue; out=c.replace(/\s+/g,' '); out=out[0].toUpperCase()+out.slice(1); }
    if(!rem.includes(out)) rem.push(out); }
  L.remark=rem.join('. ');
  return L;
}
function splitLeads(text){
  let parts=String(text).split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2) parts=String(text).split(/(?:^|\s)(?=\d{1,2}[.)]\s)/).map(s=>s.trim()).filter(Boolean);
  const real=parts.filter(p=>p.replace(/^\d{1,2}[.)]\s*/,'').length>6);
  const withPhone=real.filter(p=>findPhones(p).length);
  if(withPhone.length>=2 && withPhone.length===real.length) return real.map(p=>p.replace(/^\d{1,2}[.)]\s*/,''));
  return [String(text)];
}

function ask(d,step,text,buttons){ d.step=step; const g=()=>S.drafts[d.rid]===d&&d.step===step; say(text,buttons?buttons.map(b=>({guard:g,...b})):null); }
function leadProduct(L){ if(!(L.brand||L.model||L.category)) return null; return {brand:L.brand,model:L.model,category:L.category,qty:L.qty}; }
function sameProduct(a,b){ if(a.model||b.model) return low(a.model)===low(b.model); return low(a.brand)===low(b.brand)&&low(a.category)===low(b.category); }
function advance(d){
  const L=d.lead, r=rep(); d.step=null;
  if(L.phoneBad) return ask(d,'phone',`The number *${L.phoneBad.raw}* has ${L.phoneBad.len} digits. Please send all 10 digits.`);
  if(!L.phone) return ask(d,'phone',L.name?`What is *${L.name}*'s phone number?`:`What is the buyer's phone number?`);
  if(L.phoneDigits===r.phone){ L.phone=null;L.phoneKey=null;L.phoneDigits=null; return ask(d,'phone',`That is your own number. Please send the buyer's number.`); }
  if(L.fake && !d.ok.fake) return ask(d,'fake',`*${L.phone}* doesn't look like a real number. Please check it.`,[
    btn("It's correct",()=>{d.ok.fake=true;advance(d);}),
    btn('Change number',()=>{L.phone=null;L.phoneKey=null;L.fake=false;ask(d,'phone','Please send the correct number.');})]);
  if(!d.dupDone){ d.dupDone=true; if(dupCheck(d)) return; }
  if(L.retail && !d.ok.retail) return ask(d,'retail','This sounds like a shopper buying for personal use. Save as a retail buyer?',[
    btn('Yes, retail',()=>{d.ok.retail=true;advance(d);}),btn('No, a trader',()=>{d.ok.retail=true;L.retail=false;advance(d);})]);
  if(L.modelSuggest && !d.ok.model){ const s=L.modelSuggest; return ask(d,'model-sug',`Did you mean *${s.brand} ${s.name}*?`,[
    btn('Yes',()=>{d.ok.model=true;L.model=s.name;L.brand=s.brand;L.category=s.cat;advance(d);}),
    btn(`No, keep "${s.typed}"`,()=>{d.ok.model=true;L.model=titleCase(s.typed);advance(d);})]); }
  if(L.qtyVague && !L.qty) return ask(d,'quantity',`"${titleCase(L.qtyVague)}" is not a number. How many pieces? Send a number like 50 or 50-100.`);
  if(!L.name) return ask(d,'name',`What is the buyer's name?`);
  if(!L.location) return ask(d,'location',`Which city, country or region is *${L.name}* in?`);
  if(!L.brand) return ask(d,'brand',L.category?`Which brand of ${low(L.category)}? Type the name, for example Garmin.`:'Which brand does the buyer want? Type the name, for example Samsung.');
  if(!L.model && !L.modelSkipped && L.brand!=='Any') return ask(d,'model',`Which ${L.brand} model? Tap Skip if not sure.`,[btn('Skip',()=>{L.modelSkipped=true;advance(d);})]);
  if(!L.qty) return ask(d,'quantity','How many pieces?');
  if(!L.source) return ask(d,'source','Where did this lead come from?',SOURCES.map(s=>btn(s,()=>{L.source=s;advance(d);})));
  summary(d);
}
function dupCheck(d){
  const L=d.lead, r=rep();
  const b=S.botBuyers.find(x=>x.phoneKey===L.phoneKey||x.altKey===L.phoneKey||(L.altKey&&x.phoneKey===L.altKey));
  if(!b) return false;
  const prod=leadProduct(L); const isNew=prod&&!b.products.some(p=>sameProduct(p,prod));
  const ownerName=member(b.owner)?member(b.owner).name:'the team';
  if(b.status==='optedout'){ say(`*${b.name}*, ${b.location} asked not to be contacted. They opted out on ${fmtDate(b.statusDate)}.\nNothing added.`); endLead(d); return true; }
  if(b.status==='archived'){ ask(d,'archived',`*${b.name}*, ${b.location} was archived on ${fmtDate(b.statusDate)}. Bring them back?`,[
      btn('Bring back',()=>{ b.status='active'; b.statusDate=now(); ev(b,'status',r.id,now(),{text:'Brought back from archive via WhatsApp'}); let extra=''; if(isNew){ addProd(b,prod); extra=` and *${prodLabel(prod)}* added`; }
        say(`*${b.name}* is active again${extra}.`); savedNote(b,'Brought back'); endLead(d); }),
      btn('Leave archived',()=>{ say('OK. Nothing changed.'); endLead(d); })]); return true; }
  const created=b.history.find(e=>e.type==='created');
  if(b.owner!==r.id && now()-created.t<15*60000){ say(`*${ownerName}* saved *${b.name}*, ${b.location} ${ago(created.t)}.\nNothing added.`); endLead(d); return true; }
  const head=`Already saved as *${b.name}*, ${b.location}.\nAdded by ${ownerName} on ${fmtDate(created.t)} (${b.source}).`;
  if(isNew){ ask(d,'addprod',`${head}\n\nThis time the buyer wants *${prodLabel(prod)}*. Add it to the profile?`,[
      btn('Add these products',()=>{ addProd(b,prod); say(`Added *${prodLabel(prod)}* to ${b.name}'s profile.`); savedNote(b,'Product added'); endLead(d); }),
      btn('Leave it',()=>{ say('OK. Nothing added.'); endLead(d); })]); return true; }
  say(`${head}\nNothing added.`); endLead(d); return true;
}
function addProd(b,p){ b.products.unshift({...p,date:now(),by:S.repId}); ev(b,'product',S.repId,now(),{text:`New interest via WhatsApp: ${prodLabel(p)}`}); }
function summary(d){
  const L=d.lead; d.step='summary';
  d.sameName=S.botBuyers.find(b=>b.status!=='optedout'&&low(b.name)===low(L.name)&&b.phoneKey!==L.phoneKey)||null;
  const rows=[['Name',L.name],['Business',L.business],['Phone',L.phone],['Alt phone',L.alt],
    ['Location',L.location+(L.locAlias?` (you wrote ${L.locAlias.from})`:'')],['Product',prodLabel({...L,qty:null})],['Quantity',L.qty?`${L.qty} ${L.qty==='1'?'pc':'pcs'}`:null],
    ['Source',L.source+(L.referrer?`, by ${L.referrer}`:'')],['GST',L.gst],['Note',L.contactNote],['Tag',L.retail?'Retail':null],['Remark',L.remark||null]];
  let t=(d.total>1?`*Lead ${d.n} of ${d.total}.* `:'')+'Please check:\n'+rows.filter(r=>r[1]).map(([k,v])=>`*${k}:* ${v}`).join('\n');
  if(d.sameName) t+=`\n⚠ Another ${d.sameName.name} is saved in ${d.sameName.location} (${d.sameName.phone}). This one will be saved as a new buyer.`;
  ask(d,'summary',t,[
    btn('Save',()=>save(d),{again:()=>say(L.savedId?'This lead is already saved. Nothing added.':'This lead was not saved. Send it again to start over.')}),
    btn('Edit',()=>editPick(d)),
    btn(d.total>1?'Skip':'Cancel',()=>{ say(d.total>1?'Skipped.':'Cancelled. Nothing saved.'); endLead(d); })]);
}
function save(d){
  const L=d.lead, r=rep(), rid=S.repId, same=d.sameName;
  const commit=()=>{ const b=createBuyer(L,r); L.savedId=b.id; savedNote(b,'New buyer');
    say(`Saved ✓ *${b.name}*, ${b.location}. Buyer #${b.id}.`+(same?`\nSaved as a new buyer. Another ${same.name} is in ${same.location}.`:''),null,rid); };
  if(S.slow){ say('Received. I will confirm when saved.'); L.savedId=-1; if(S.sync) sys('A few seconds later'); later(2800,commit); } else commit();
  endLead(d);
}
function createBuyer(L,r){
  const b={id:S.nextId++,name:L.name,business:L.business,phone:L.phone,phoneKey:L.phoneKey,alt:L.alt,altKey:L.altKey,location:L.location,overseas:L.overseas,
    products:[{brand:L.brand,model:L.model,category:L.category,qty:L.qty,date:now(),by:r.id}],source:L.source,referrer:L.referrer,
    tags:L.retail?['Retail']:[],contactNote:L.contactNote,gst:L.gst,owner:r.id,status:'active',statusDate:null,deals:[],history:[]};
  ev(b,'created',r.id,now(),{via:L.viaContact?'WhatsApp bot (forwarded contact)':'WhatsApp bot',text:`Added from ${L.source}${L.referrer?' by '+L.referrer:''} · wants ${prodLabel(b.products[0])}`});
  if(L.remark) ev(b,'remark',r.id,now(),{cat:'General',text:L.remark});
  if(L.contactNote) ev(b,'remark',r.id,now(),{cat:'General',text:L.contactNote});

function editPick(d){
  ask(d,'editpick','What do you want to change?',['Name','Phone','Location','Product','Quantity','Source','Remark'].map(f=>btn(f,()=>{ d.editing=low(f); ask(d,'edit',`Send the new ${low(f)}.`); })));
}
function answer(d,text){
  const L=d.lead, p=parseLead(text);
  const fill=()=>{ for(const k of ['business','location','overseas','locAlias','brand','model','category','qty','source','referrer','remark','retail','contactNote','gst','alt','altKey'])
      if((L[k]==null||L[k]===''||L[k]===false)&&p[k]!=null&&p[k]!==''&&p[k]!==false) L[k]=p[k]; };
  const clean=s=>s.replace(/[^\p{L}\s.'-]/gu,' ').trim();
  const field=d.step==='edit'?d.editing:d.step;
  switch(field){
    case 'phone':
      if(!p.phone){ if(p.phoneBad) return ask(d,d.step,`The number *${p.phoneBad.raw}* has ${p.phoneBad.len} digits. Please send all 10 digits.`);
        return ask(d,d.step,'Please send the phone number as digits, for example 98250 12345.'); }
      Object.assign(L,{phone:p.phone,phoneKey:p.phoneKey,phoneDigits:p.phoneDigits,fake:p.fake,phoneBad:null}); d.dupDone=false; d.ok.fake=false; break;
    case 'name': { const n=extractName(' '+low(text).replace(/[^a-z\s'.-]/g,' ')+' ')||titleCase(clean(text)); if(!n) return ask(d,d.step,"Please send the buyer's name in letters."); L.name=n; break; }
    case 'location': L.location=p.location||titleCase(clean(text)); L.overseas=p.overseas; L.locAlias=p.locAlias; break;
    case 'brand': { if(p.model){ L.model=p.model; L.brand=p.brand; L.category=p.category; break; }
      const mb=matchBrand(text); if(!mb) return ask(d,d.step,`I don't know the brand "${text.trim()}". Please check the spelling, or type *any* if the buyer is open to any brand.`);
      L.brand=mb.brand; if(mb.fixed) say(`Got it: *${mb.brand}* (you wrote "${mb.typed}").`); break; }
    case 'model': case 'product':
      if(field==='model'&&/^\s*skip\s*$/i.test(text)){ L.modelSkipped=true; break; }
      if(p.model){ L.model=p.model; L.brand=p.brand; L.category=p.category; }
      else if(p.modelSuggest){ L.modelSuggest=p.modelSuggest; d.ok.model=false; if(field==='product') L.model=null; }
      else if(field==='product'&&(p.brand||p.category)){ L.brand=p.brand||L.brand; L.category=p.category||L.category; L.model=null; L.modelSkipped=true; }
      else L.model=titleCase(clean(text));
      break;
    case 'quantity': { const q=p.qty||((/^\s*(\d+(?:\s*(?:-|to)\s*\d+)?)\s*(pcs|pieces?|nang|units?)?\s*$/i.exec(text)||[])[1]);
      if(!q) return ask(d,d.step,'Please send a number, like 50 or 50-100.'); L.qty=q.replace(/\s*(?:-|to)\s*/,'-'); L.qtyVague=null; L.retail=L.retail||q==='1'; break; }
    case 'source': L.source=p.source||matchSource(text)||titleCase(clean(text)); if(p.referrer) L.referrer=p.referrer; break;
    case 'remark': L.remark=text.trim(); break;
    default: return say('Please tap one of the buttons above, or type *cancel* to start over.');
  }
  if(d.step!=='edit') fill();
  d.editing=null; advance(d);
}
function onVoice(v){
  closeMenus(); pushRep({kind:'voice',dur:v.dur});
  if(!approvedOrRefuse()) return;
  if(!v.text){ say('I could not hear this clearly. Send it again or type it?',[btn('Record again',()=>say('OK. Send the voice note again.')),btn('Type it',()=>say('OK. Type the details.'))]); return; }
  say(`I heard: “${v.text}”`);
  const d=D(); if(d&&d.step) return answer(d,v.text);
  startLeads(v.text);
}
function onAttach(kind){
  closeMenus(); pushRep({kind});
  if(!approvedOrRefuse()) return;
  if(kind==='contact'){
    const info=phoneInfo({kind:'in',digits:CONTACT.phone});
    const d=D();
    if(d&&d.step==='phone'){ Object.assign(d.lead,info,{phoneBad:null}); d.dupDone=false; d.ok.fake=false; say(`Got the number from the contact: *${info.phone}*.`); return advance(d); }
    const L=parseLead(''); Object.assign(L,info,{name:CONTACT.name,business:CONTACT.company,viaContact:true});
    const nd={rid:S.repId,queue:[L],n:0,total:1}; S.drafts[S.repId]=nd;
    say(`Got the contact: *${CONTACT.name}* (${CONTACT.company}), ${info.phone}.`);
    return nextLead(nd);
  }
  if(kind==='photo') say('Reading visiting cards is coming in phase 2. For now, please type the name, number and city from the card, or forward the contact.');
  else say('I could not read this. Please type the details.');
}

}
function useRep(id){ S.repId=id; if(!S.sync) renderChat(); }
function tapLabel(label){ const c=S.chats[S.repId]; for(let i=c.length-1;i>=0;i--){ const m=c[i]; if(m.buttons){ const j=m.buttons.findIndex(b=>b.label===label); if(j>=0){ tapButton(m,j,true); return true; } } } return false; }
function doStep(st){
  if(st.as) useRep(st.as);
  else if(st.setup==='tworeps'){ setupTworeps(); sys('Priya saved Harsh Vora 2 minutes ago'); }
  else if(st.slow){ S.slow=true; }
  else if(st.s!=null||st.r!=null) onText(st.s!=null?st.s:st.r);
  else if(st.voice!=null) onVoice(VOICES[st.voice]);
  else if(st.att) onAttach(st.att);
  else if(st.tap) tapLabel(st.tap);
  else if(st.skip) skip30();
}
function runLive(sc){
  setView('bot'); setSub('chat');
  const first=sc.steps.find(s=>s.as); useRep(first?first.as:'amit'); S.slow=false;
  delete S.drafts[S.repId]; S.last[S.repId]=null;
  sys(`Scenario: ${sc.t}`);
  let delay=0;
  for(const st of sc.steps){ if(st.tap||st.r!=null) break; const d=delay; later(d,()=>doStep(st)); if(st.s!=null||st.voice!=null||st.att) delay+=1500; if(st.skip) delay+=0; }
  const next=sc.steps.find(s=>s.tap||s.r!=null);
  if(next) toast(next.tap?`Next: tap ${next.tap}`:`Next: reply "${next.r}"`);
}

const RANGES=[['today','Today'],['yesterday','Yesterday'],['last7','Last 7 days'],['week','This week'],['month','This month'],['last30','Last 30 days'],['all','All time'],['custom','Custom dates']];

function dailyChart(ids,R){
  const W=700, H=220, L=34, Rp=10, Tp=14, Bt=28;
  const end=sod(R.to); let start=Math.max(sod(R.from),end-30*DAY); let days=Math.round((end-start)/DAY)+1;
  const short=days<7; if(short){ start=end-6*DAY; days=7; }
  const data=Array.from({length:days},(_,i)=>{ const t=start+i*DAY; const row={t,inR:t>=sod(R.from)&&t<=R.to}; ids.forEach(id=>row[id]=0); return row; });
  for(const b of S.buyers){ const c=createdOf(b); const i=Math.round((sod(c.t)-start)/DAY); if(i>=0&&i<days&&ids.includes(c.by)) data[i][c.by]++; }
  const max=Math.max(1,...data.map(r=>ids.reduce((s,id)=>s+r[id],0)));
  const step=max<=5?1:max<=10?2:max<=25?5:10; const top=Math.ceil(max/step)*step;
  const y=v=>Tp+(H-Tp-Bt)*(1-v/top); const bw=(W-L-Rp)/days;
  const every=days<=8?1:days<=16?2:Math.ceil(days/8);
  let g=''; for(let v=0;v<=top;v+=step) g+=`<line class="grid" x1="${L}" x2="${W-Rp}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  let bars=''; data.forEach((r,i)=>{ let acc=0; const x=L+i*bw+bw*.18, w=bw*.64; const tot=ids.reduce((s,id)=>s+r[id],0);
    bars+=`<g opacity="${r.inR?1:.3}">`;
    ids.forEach(id=>{ const v=r[id]; if(!v) return; bars+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${y(acc)-y(acc+v)}" fill="${colorOf(id)}" rx="2"><title>${fmtDate(r.t)} · ${member(id).name}: ${v}</title></rect>`; acc+=v; });
    const isToday=r.t===sod(now()); const lab=isToday?'Today':((days-1-i)%every===0?(days<=16?String(new Date(r.t).getDate()):fmtDate(r.t)):'');
    if(lab) bars+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${lab}</text>`;
    if(tot&&days<=16) bars+=`<text x="${x+w/2}" y="${y(tot)-4}" text-anchor="middle">${tot}</text>`;
    bars+=`</g>`; });
  const note=short?`<p class="muted" style="margin:6px 0 0;font-size:12px">Showing the week around your dates. Days outside them are faded.</p>`:(sod(R.from)<start?`<p class="muted" style="margin:6px 0 0;font-size:12px">Showing the last 31 days of your dates.</p>`:'');
  return `<div class="tbl-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="Leads added per day, ${fmtDate(start)} to ${fmtDate(end)}">${g}${bars}</svg></div>${note}`;
}

const prodKey=p=>p.model?low(p.model):low([p.brand&&p.brand!=='Any'?p.brand:'',p.category||''].join(' ').trim());
const prodName=p=>p.model?(p.brand&&!low(p.model).startsWith(low(p.brand))&&p.brand!=='Any'?`${p.brand} ${p.model}`:p.model):[p.brand&&p.brand!=='Any'?p.brand:'Any brand',p.category?low(p.category)+'s':'(model not given)'].join(' ');
const qtyNum=q=>{ const m=/\d+/.exec(q||''); return m?+m[0]:0; };
function productIndex(R){
  const map=new Map();
  const get=(p)=>{ const k=prodKey(p); if(!k) return null; if(!map.has(k)) map.set(k,{key:k,name:prodName(p),model:p.model||'',brand:p.brand&&p.brand!=='Any'?p.brand:'Any',category:p.category||(MODELS.find(m=>low(m.name)===low(p.model||''))||{}).cat||'Other',
      known:!!(p.model&&MODELS.some(m=>low(m.name)===low(p.model))),generic:!p.model,mentions:[],buyers:new Set(),qty:0,first:null,last:0,open:0,openVal:0,won:0,wonVal:0,deals:[]}); return map.get(k); };
  for(const b of S.buyers){
    const created=createdOf(b);
    for(const p of b.products){ const e=get(p); if(!e) continue;
      const m={b,t:p.date,by:p.by,qty:p.qty,via:p.date===created.t?created.via:'WhatsApp bot'};
      if(!e.first||m.t<e.first.t) e.first=m;
      if(R&&(m.t<R.from||m.t>R.to)) continue;
      e.mentions.push(m); e.buyers.add(b.id); e.qty+=qtyNum(p.qty); if(m.t>e.last) e.last=m.t; }
    for(const d of b.deals){ const e=map.get(low(d.product)); if(!e) continue; e.deals.push({b,d});
      if(!['Won','Lost'].includes(d.stage)){ e.open++; e.openVal+=d.qty*d.price; } if(d.stage==='Won'){ e.won++; e.wonVal+=d.qty*d.price; } }
  }
  return [...map.values()];
}

  const isAdmin=u.role==='admin'; const can=isAdmin||b.owner===u.id; const [sk,sl]=statusOf(b);
  const won=b.deals.filter(d=>d.stage==='Won').reduce((s,d)=>s+d.qty*d.price,0); const lr=lastRemark(b);
  const facts=[['Phone',`<span class="mono">${hx(b.phone)}</span>`],['Alternate phone',b.alt&&`<span class="mono">${hx(b.alt)}</span>`],['Location',hx(b.location)+(b.overseas?' · overseas':'')],
    ['Source',hx(b.source)+(b.referrer?`, by ${hx(b.referrer)}`:'')],['Owner',isAdmin?`<select id="ownerSel" aria-label="Owner" style="border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px">${S.team.filter(m=>m.role==='rep').map(m=>`<option value="${m.id}" ${b.owner===m.id?'selected':''}>${hx(m.name)}</option>`).join('')}</select>`:hx(member(b.owner).name)],
    ['Added',`${when(createdOf(b).t)} via ${hx(createdOf(b).via)}`],['GST',b.gst&&`<span class="mono">${hx(b.gst)}</span>`],['Won so far',won?inr(won):null],['Last contacted',lr?when(lr.t):'Not yet']].filter(r=>r[1]);
  let h=`<button class="backlink" type="button" data-nav="${S.dash.back||'buyers'}">← Back</button>
   <div class="card"><div class="bhead"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill p-${sk}">${sl}</span><span class="muted mono" style="font-size:12px">Buyer #${b.id}</span></div>
     <h2 style="margin-top:6px">${hx(b.name)}</h2>${b.business?`<div class="muted">${hx(b.business)}</div>`:''}</div>
     <div class="actions">${can?`<button class="primary" type="button" data-act="remark">Add remark</button><button class="ghost" type="button" data-act="deal">New deal</button>
       ${b.status==='active'?`<button class="ghost" type="button" data-act="archive">Archive</button>`:`<button class="ghost" type="button" data-act="restore">Make active</button>`}
       ${b.status!=='optedout'?`<button class="ghost danger" type="button" data-act="optout">Opted out</button>`:''}`:''}</div></div>
     <div class="facts">${facts.map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('')}</div>
     ${!can?`<div class="locked" style="margin-top:12px">${hx(member(b.owner).name)} owns this buyer. You can see the history, but only the owner or an admin can add remarks and deals.</div>`:''}</div>`;
  h+=`<div class="card"><div class="card-h"><h2>Deals</h2>${can?`<button class="linkbtn" type="button" data-act="deal">+ New deal</button>`:''}</div>`+
    (b.deals.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price / pc</th><th class="num">Value</th><th>Stage</th><th>Opened</th></tr></thead><tbody>${b.deals.slice().reverse().map(d=>`<tr><td>${hx(d.product)}</td><td class="num">${d.qty}</td><td class="num">${inr(d.price)}</td><td class="num">${inrShort(d.qty*d.price)}</td>
      <td>${can?`<select data-stage="${d.id}" aria-label="Stage" style="border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px">${STAGES.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="pill p-${low(d.stage)}">${d.stage}</span>`}</td><td>${fmtDate(d.created)} · ${hx(member(d.by).name.split(' ')[0])}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No deals yet.${can?' Open one when the buyer asks for a rate.':''}</div>`)+`</div>`;
  h+=`<div class="card"><div class="card-h"><h2>Wants</h2></div><div style="display:flex;flex-wrap:wrap;gap:6px">${b.products.map(p=>`<span class="cat" style="font-size:12.5px;padding:4px 9px">${hx(prodLabel(p))} <span class="muted" style="font-weight:400">· ${fmtDate(p.date)}</span></span>`).join('')}</div></div>`;
  h+=`<div class="card"><div class="card-h"><h2>Complete history</h2><span class="muted" style="font-size:12.5px">${b.history.length} entries, newest first</span></div><div class="timeline">${b.history.slice().reverse().map(e=>{ const who=member(e.by)?member(e.by).name:'Someone';
      const what={created:`Added to Buyer Tracker via ${hx(e.via)}`,remark:`Remark <span class="cat">${hx(e.cat)}</span>`,deal:'Deal opened',stage:'Deal updated',product:'New interest',status:'Status changed',owner:'Owner changed',edit:'Details edited'}[e.type]||'Update';
      return `<div class="tl"><span class="dot ${e.type}">${dotLetter[e.type]||'•'}</span><div><div class="what">${what}</div><div class="by">${hx(who)} · ${when(e.t)}${e.t<sod(now())-DAY?' '+clock(e.t):''}</div>${e.text?`<div class="txt">${hx(e.text)}</div>`:''}</div></div>`; }).join('')}</div></div>`;
  return h;
}

      <td>${m.role==='admin'?'Admin':'Sales rep'}</td><td class="mono">${fmtIn(m.phone)}</td>
      <td>${m.bot?'<span class="pill p-approved">Approved</span>':'<span class="pill p-pending">Pending</span>'} ${m.id!==ADMIN_ID?`<button class="linkbtn" style="font-size:12.5px;margin-left:4px" type="button" data-tbot="${m.id}">${m.bot?'Revoke':'Approve'}</button>`:''}</td>

/* ---------- Dashboard: modals ---------- */
function modal(html,onSubmit){
  const el=$('#modal'); el.innerHTML=`<form class="sheet" novalidate>${html}</form>`; el.hidden=false;
  const f=el.querySelector('form');
  el.onclick=e=>{ if(e.target===el||e.target.closest('[data-close]')) el.hidden=true; };
  f.onsubmit=e=>{ e.preventDefault(); const err=onSubmit(f); if(err){ const m=f.querySelector('.msg'); m.className='msg '+(err.warn?'warn':'err'); m.textContent=err.text||err; m.hidden=false; } else { el.hidden=true; } };
  const first=f.querySelector('input,select,textarea'); if(first) first.focus();
}
const mhead=t=>`<div style="display:flex;align-items:center;gap:8px"><h2>${t}</h2><button class="close" type="button" data-close>Close</button></div><div class="msg" hidden></div>`;
const val=(f,id)=>f.querySelector('#'+id).value.trim();
function remarkModal(b){
  modal(`${mhead('Add remark')}<p class="muted" style="margin:-6px 0 0">${hx(b.name)} · ${hx(b.location)}</p><div class="form">
    <label class="field full">Category<select id="r-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
    <label class="field full">Remark<textarea id="r-text" rows="3" placeholder="Called, wants a rate for 50 pieces by Friday"></textarea></label></div>
    <div class="actions"><button class="primary" type="submit">Save remark</button><button class="ghost" type="button" data-close>Cancel</button></div>`,f=>{
      const text=val(f,'r-text'); if(!text) return 'Write the remark first.';
      const cat=val(f,'r-cat'); ev(b,'remark',S.user,now(),{cat,text});
      toast('Remark saved'); renderDash(); });
}
function dealModal(b){
  const p=b.products[0]; const model=p&&p.model;
  modal(`${mhead('New deal')}<p class="muted" style="margin:-6px 0 0">${hx(b.name)} · ${hx(b.location)}</p><div class="form">
    <label class="field full">Product<select id="d-prod">${MODELS.map(m=>`<option ${m.name===model?'selected':''}>${m.name}</option>`).join('')}</select></label>
    <label class="field">Quantity<input id="d-qty" inputmode="numeric" value="${p&&/^\d+$/.test(p.qty||'')?p.qty:''}" placeholder="50"></label>
    <label class="field">Price per piece (₹)<input id="d-price" inputmode="numeric" value="${model&&PRICE[model]?PRICE[model]:''}"></label>
    <label class="field full">Stage<select id="d-stage">${STAGES.slice(0,3).map(s=>`<option>${s}</option>`).join('')}</select></label></div>
    <div class="actions"><button class="primary" type="submit">Open deal</button><button class="ghost" type="button" data-close>Cancel</button></div>`,f=>{
      const q=+val(f,'d-qty'), pr=+val(f,'d-price').replace(/[,₹\s]/g,'');
      if(!q||q<1) return 'Enter the quantity as a number.'; if(!pr||pr<1) return 'Enter the price per piece as a number.';
      addDeal(b,S.user,now(),val(f,'d-prod'),q,pr,val(f,'d-stage')); toast('Deal opened'); renderDash(); });
}
function buyerFormModal(){
  let warned=false;
  modal(`${mhead('Add buyer')}<div class="form">
    <label class="field">Name *<input id="f-name" placeholder="Rahul Mehta"></label><label class="field">Business<input id="f-biz" placeholder="Mehta Mobiles"></label>
    <label class="field">Phone *<input id="f-phone" inputmode="tel" placeholder="98250 12345 or +971…"></label><label class="field">Alternate phone<input id="f-alt" inputmode="tel"></label>
    <label class="field">City, country or region *<input id="f-loc" placeholder="Surat"></label><label class="field">Source<select id="f-src">${SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></label>
    <label class="field">Product<select id="f-model"><option value="">Choose</option>${MODELS.map(m=>`<option>${m.name}</option>`).join('')}</select></label><label class="field">Quantity<input id="f-qty" placeholder="50 or 50-100"></label>
    <label class="field">GST number<input id="f-gst" placeholder="Optional"></label>${member(S.user).role==='admin'?`<label class="field">Owner<select id="f-owner">${S.team.filter(m=>m.role==='rep').map(m=>`<option value="${m.id}">${hx(m.name)}</option>`).join('')}</select></label>`:'<span></span>'}
    <label class="field full">First remark<textarea id="f-rem" rows="2" placeholder="Pays cash on delivery"></textarea></label>
    <label class="field check full"><input type="checkbox" id="f-retail"> Shopper buying for personal use (retail)</label></div>
    <div class="actions"><button class="primary" type="submit">Save buyer</button><button class="ghost" type="button" data-close>Cancel</button></div>`,f=>{
      if(!val(f,'f-name')) return "Enter the buyer's name.";
      const ph=findPhones(val(f,'f-phone'))[0]; if(!ph) return 'Enter the phone number as digits, for example 98250 12345.';
      if(ph.kind==='bad') return `The phone number has ${ph.len} digits. Enter all 10 digits.`;
      const info=phoneInfo(ph); if(info.fake) return `${info.phone} doesn't look like a real number. Check it and try again.`;
      if(S.team.some(m=>m.phone===info.phoneDigits)) return "That is a team member's number. Enter the buyer's number.";
      const ex=S.buyers.find(b=>b.phoneKey===info.phoneKey||b.altKey===info.phoneKey); if(ex) return `Already saved as ${ex.name}, ${ex.location} (buyer #${ex.id}, ${statusOf(ex)[1].toLowerCase()}).`;
      if(!val(f,'f-loc')) return 'Enter a city, country or region.';
      const gst=val(f,'f-gst'); if(gst&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/i.test(gst)) return 'The GST number should be 15 characters, like 24AABCP1234C1Z5.';
      const name=titleCase(val(f,'f-name')); const same=S.buyers.find(b=>low(b.name)===low(name));
      if(same&&!warned){ warned=true; return {warn:true,text:`Another ${same.name} is saved in ${same.location}. Press Save again to add this as a new buyer.`}; }
      const loc=findLocation(low(val(f,'f-loc'))); const m=MODELS.find(x=>x.name===val(f,'f-model'));
      const altP=findPhones(val(f,'f-alt')).find(x=>x.kind!=='bad'); const alt=altP?phoneInfo(altP):null;
      const owner=f.querySelector('#f-owner')?val(f,'f-owner'):S.user;
      const b=newBuyer({name,business:val(f,'f-biz')||null,ph:info.phoneKey.startsWith('91')&&ph.kind==='in'?info.phoneDigits:undefined,intl:ph.kind==='intl'?info.phoneDigits:undefined,
        location:loc?loc.location:titleCase(val(f,'f-loc')),overseas:loc?loc.overseas:false,products:m?[{brand:m.brand,model:m.name,category:m.cat,qty:val(f,'f-qty')||null}]:[],
        source:val(f,'f-src'),owner,addedAt:now(),via:`Dashboard (${member(S.user).name})`,remark:val(f,'f-rem')||null,tags:f.querySelector('#f-retail').checked?['Retail']:[],gst:gst?gst.toUpperCase():null});
      if(alt){ b.alt=alt.phone; b.altKey=alt.phoneKey; }
      if(!b.products.length) b.products=[{brand:null,model:null,category:null,qty:null,date:now(),by:owner}];
      S.buyers.unshift(b); toast(`Saved ${b.name}`); S.dash.view='buyer'; S.dash.buyerId=b.id; S.dash.back='buyers'; renderDash(); renderSaved(); });
}
function memberModal(m){
  const isNew=!m;
  modal(`${mhead(isNew?'Add team member':'Edit '+hx(m.name))}<div class="form">
    <label class="field">Name *<input id="m-name" value="${isNew?'':hx(m.name)}" placeholder="Sneha Joshi"></label>
    <label class="field">WhatsApp number *<input id="m-phone" inputmode="tel" value="${isNew?'':m.phone}" placeholder="97120 44003"></label>
    <label class="field">Role<select id="m-role"><option value="rep">Sales rep</option><option value="admin" ${!isNew&&m.role==='admin'?'selected':''}>Admin</option></select></label>
    <label class="field">Monthly lead target<input id="m-target" inputmode="numeric" value="${isNew?40:m.target||''}"></label>
    <label class="field check full"><input type="checkbox" id="m-bot" ${isNew||m.bot?'checked':''}> Can add buyers on WhatsApp</label>
    ${isNew?'':`<label class="field check full"><input type="checkbox" id="m-active" ${m.active?'checked':''}> Active (can sign in and use the bot)</label>`}</div>
    <div class="actions"><button class="primary" type="submit">${isNew?'Add member':'Save changes'}</button><button class="ghost" type="button" data-close>Cancel</button></div>`,f=>{
      const name=titleCase(val(f,'m-name')); if(!name) return 'Enter a name.';
      const ph=findPhones(val(f,'m-phone'))[0]; if(!ph||ph.kind!=='in') return 'Enter a 10-digit Indian mobile number.';
      if(S.team.some(x=>x.phone===ph.digits&&x!==m)) return 'Another team member already uses this number.';
      const data={name,phone:ph.digits,role:val(f,'m-role'),target:+val(f,'m-target')||0,bot:f.querySelector('#m-bot').checked};
      if(isNew){ const id=low(name.split(' ')[0])+S.team.length; S.team.push({id,...data,active:true,joined:now()}); S.chats[id]=[{sys:`Chatting as ${name}`}];
        if(data.bot) S.chats[id].push({from:'bot',text:`Hi ${name.split(' ')[0]}. Send me a new buyer the way you normally would.`,t:now()}); }
      else { Object.assign(m,data); m.active=f.querySelector('#m-active').checked; }
      fillRepSel(); toast(isNew?`${name} added`:'Changes saved'); renderDash(); });
}
function memberActivity(id){
  const m=member(id); const mo=kpi(id,T.month()), wk=kpi(id,T.week()), all=kpi(id,0);
  const feed=allEvents().filter(x=>x.e.by===id).slice(0,12);
  modal(`${mhead(hx(m.name))}<div class="tiles">${tile('Leads this month',mo.leads,m.target?`target ${m.target}`:'')}${tile('Remarks this week',wk.remarks)}${tile('Won this month',inrShort(mo.wonVal))}</div>
    <h3>Recent activity</h3><div class="feed">${feed.length?feed.map(({b,e})=>`<div class="feed-item"><span class="dot ${e.type}">${dotLetter[e.type]||'•'}</span><div><div>${evLine(e,b)}</div>${e.text&&e.type!=='created'?`<div class="muted" style="font-size:12.5px">${hx(e.text)}</div>`:''}<div class="when">${when(e.t)}</div></div></div>`).join(''):'<div class="empty">No activity yet.</div>'}</div>`,()=>null);
}

/* ---------- Dashboard: events ---------- */
function openBuyerInDash(id){ setView('dash'); if(!S.user){ S.afterLogin=id; renderDash(); toast('Sign in to open the buyer.'); return; } S.dash.back=S.dash.view==='buyer'?S.dash.back:S.dash.view; S.dash.view='buyer'; S.dash.buyerId=id; renderDash(); }
$('#v-dash').addEventListener('submit',e=>{ if(e.target.id!=='loginForm') return; e.preventDefault();
  S.user=e.target.querySelector('input[name=who]:checked').value; S.dash.view='overview'; S.dash.filter='all'; S.dash.owner='all';
  if(S.afterLogin){ S.dash.view='buyer'; S.dash.buyerId=S.afterLogin; S.dash.back='buyers'; S.afterLogin=null; } renderDash(); });
$('#v-dash').addEventListener('click',e=>{
  const t=e.target;
  const nav=t.closest('[data-nav]'); if(nav){ S.dash.view=nav.dataset.nav; renderDash(); $('#work')&&($('#work').scrollTop=0); return; }
  const by=t.closest('[data-buyer]'); if(by&&!t.closest('select')){ S.dash.back=S.dash.view; S.dash.view='buyer'; S.dash.buyerId=+by.dataset.buyer; renderDash(); $('#work').scrollTop=0; return; }
  const bf=t.closest('[data-bf]'); if(bf){ S.dash.filter=bf.dataset.bf; renderDash(); return; }
  const mem=t.closest('[data-member]'); if(mem){ memberActivity(mem.dataset.member); return; }
  const tb=t.closest('[data-tbot]'); if(tb){ const m=member(tb.dataset.tbot); m.bot=!m.bot; fillRepSel(); toast(m.bot?`${m.name} can now add buyers on WhatsApp`:`${m.name} can no longer use the bot`); renderDash(); return; }
  const em=t.closest('[data-editm]'); if(em){ memberModal(member(em.dataset.editm)); return; }
  const a=t.closest('[data-act]'); if(!a) return; const act=a.dataset.act; const b=S.buyers.find(x=>x.id===S.dash.buyerId);
  if(act==='logout'){ S.user=null; renderDash(); return; }
  if(act==='addbuyer') return buyerFormModal();
  if(act==='addmember') return memberModal(null);
  if(act==='remark') return remarkModal(b);
  if(act==='deal') return dealModal(b);
  if(act==='archive'){ b.status='archived'; b.statusDate=now(); ev(b,'status',S.user,now(),{text:'Archived'}); toast(`${b.name} archived`); }
  if(act==='restore'){ b.status='active'; b.statusDate=now(); ev(b,'status',S.user,now(),{text:'Made active again'}); toast(`${b.name} is active`); }
  if(act==='optout'){ b.status='optedout'; b.statusDate=now(); ev(b,'status',S.user,now(),{text:'Marked as opted out. The bot will refuse this number.'}); toast(`${b.name} marked as opted out`); }
  renderDash();
});
$('#v-dash').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const r=e.target.closest('tr[data-buyer]'); if(r) r.click(); } });
$('#v-dash').addEventListener('input',e=>{ if(e.target.id==='pq'){ S.dash.pq=e.target.value; const pos=e.target.selectionStart; renderDash(); const i=$('#pq'); i.focus(); i.setSelectionRange(pos,pos); return; }
  if(e.target.id==='bq'){ S.dash.q=e.target.value; const pos=e.target.selectionStart; renderDash(); const i=$('#bq'); i.focus(); i.setSelectionRange(pos,pos); } });
$('#v-dash').addEventListener('change',e=>{
  if(e.target.id==='bowner'){ S.dash.owner=e.target.value; renderDash(); return; }
  const rs=e.target.closest('[data-range]'); if(rs){ const w=rs.dataset.range; const old=rangeOf(S.dash[w]); S.dash[w]=rs.value==='custom'?{key:'custom',from:old.from||sod(now())-6*DAY,to:old.to}:{key:rs.value}; renderDash(); return; }
  const rf=e.target.closest('[data-rfrom],[data-rto]'); if(rf&&rf.value){ const w=rf.dataset.rfrom||rf.dataset.rto; const r=S.dash[w]; const R=rangeOf(r); const v=fromISO(rf.value);
    if(rf.dataset.rfrom){ r.from=v; r.to=Math.max(v,R.to); } else { r.to=v; r.from=Math.min(v,R.from); } renderDash(); return; }
  if(e.target.id==='ownerSel'){ const b=S.buyers.find(x=>x.id===S.dash.buyerId); const from=member(b.owner).name; b.owner=e.target.value; ev(b,'owner',S.user,now(),{text:`Moved from ${from} to ${member(b.owner).name}`}); toast('Owner changed'); renderDash(); return; }
  const st=e.target.closest('[data-stage]'); if(st){ const b=S.buyers.find(x=>x.id===S.dash.buyerId); const d=b.deals.find(x=>x.id===st.dataset.stage); const old=d.stage; d.stage=st.value; if(d.stage==='Won') d.wonAt=now();
    ev(b,'stage',S.user,now(),{text:`${d.product} × ${d.qty}: ${old} → ${d.stage}`}); toast(`Deal moved to ${d.stage}`); renderDash(); }
});

function fillRepSel(){ if(S.view==='bot') renderChat(); }
$('#scenList').innerHTML=SCEN.map((g,gi)=>`<div class="scen-group"><h3>${g.g}</h3><div class="scen-list">${g.items.map((s,i)=>
  `<button type="button" class="scen-btn" data-g="${gi}" data-i="${i}"><span>${hx(s.t)}</span>${s.tag?`<span class="tag${s.tag==='New'?' new':''}">${s.tag}</span>`:''}</button>`).join('')}</div></div>`).join('');
$('#scenList').addEventListener('click',e=>{ const b=e.target.closest('.scen-btn'); if(b) runLive(SCEN[+b.dataset.g].items[+b.dataset.i]); });
$('#resetChatBtn').addEventListener('click',resetChat);
$('#resetBtn').addEventListener('click',()=>{ boot(); toast('Demo reset'); });
const input=$('#input');
$('#composer').addEventListener('submit',e=>{ e.preventDefault(); const v=input.value; input.value=''; autosize(); closeMenus(); onText(v); });
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#composer').requestSubmit(); } });
function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; }
input.addEventListener('input',autosize);
$('#voiceMenu').innerHTML=VOICES.map((v,i)=>`<button type="button" data-v="${i}">${v.label} <small>${v.lang} · ${v.dur}</small></button>`).join('');
function closeMenus(){ if(S&&S.sync) return; $('#attachMenu').hidden=true; $('#voiceMenu').hidden=true; }
$('#attachBtn').addEventListener('click',()=>{ const m=$('#attachMenu'); const o=m.hidden; closeMenus(); m.hidden=!o; });
$('#micBtn').addEventListener('click',()=>{ const m=$('#voiceMenu'); const o=m.hidden; closeMenus(); m.hidden=!o; });
$('#attachMenu').addEventListener('click',e=>{ const b=e.target.closest('[data-att]'); if(b) onAttach(b.dataset.att); });
$('#voiceMenu').addEventListener('click',e=>{ const b=e.target.closest('[data-v]'); if(b) onVoice(VOICES[+b.dataset.v]); });
function setView(v){ S.view=v; document.querySelectorAll('.mainnav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===v)));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='v-'+v)); safeSet('bt-view',v);
  if(v==='dash') renderDash(); if(v==='bot') renderChat(); }
function setSub(s){ document.querySelectorAll('.subtabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.sub===s)));
  $('#p-scen').classList.toggle('on',s==='scen'); $('#p-chat').classList.toggle('on',s==='chat'); if(s==='chat') renderChat(); }
document.querySelector('.mainnav').addEventListener('click',e=>{ const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view); });
document.querySelector('.subtabs').addEventListener('click',e=>{ const b=e.target.closest('[data-sub]'); if(b) setSub(b.dataset.sub); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#modal').hidden=true; closeMenus(); } });
let toastT; function toast(t){ if(S&&S.sync) return; const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2800); }
function boot(){
  timers.forEach(clearTimeout); timers=[]; const v=S?S.view:null;
  buildState(); S.bootT=now(); S.view=v||'bot';
  fillRepSel(); renderSaved(); renderChat(); setView(S.view);
}
boot();
const savedView=safeGet('bt-view'); if(savedView&&['bot','dash'].includes(savedView)) setView(savedView);
</script>

</body></html>
